<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Вход</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #0b0f14; color: #e6edf3;
      font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    .card {
      width: min(360px, 92vw); background: #131a22; border: 1px solid #223040;
      border-radius: 14px; padding: 28px; box-shadow: 0 20px 60px rgba(0,0,0,.45);
    }
    h1 { font-size: 18px; margin: 0 0 4px; }
    p.sub { margin: 0 0 20px; color: #8899a6; font-size: 13px; }
    label { display: block; font-size: 12px; color: #8899a6; margin-bottom: 6px; }
    input {
      width: 100%; padding: 12px 14px; border-radius: 10px; border: 1px solid #2a3a4a;
      background: #0d141b; color: #e6edf3; font-size: 15px; outline: none;
    }
    input:focus { border-color: #3b82f6; }
    button {
      margin-top: 16px; width: 100%; padding: 12px; border: 0; border-radius: 10px;
      background: #2563eb; color: #fff; font-size: 15px; font-weight: 600; cursor: pointer;
    }
    button:hover { background: #1d4ed8; }
    .err { margin-top: 14px; color: #ff6b6b; font-size: 13px; min-height: 18px; }
  </style>
</head>
<body>
  <form class="card" method="POST" action="/login">
    <h1>🖥️ Удалённый рабочий стол</h1>
    <p class="sub">Введите пароль доступа</p>
    <label for="pw">Пароль</label>
    <input id="pw" name="password" type="password" autocomplete="current-password" autofocus>
    <button type="submit">Войти</button>
    <div class="err" id="err"></div>
  </form>
  <script>
    if (new URLSearchParams(location.search).get('e')) {
      document.getElementById('err').textContent = 'Неверный пароль';
    }
  </script>
</body>
</html>
