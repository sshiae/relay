<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Личный кабинет</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #05080b; --panel: #0d141b; --panel2: #131c26; --line: #223040;
      --text: #e6edf3; --muted: #8a99a8; --accent: #3b82f6; --accent2: #2563eb;
      --ok: #2ea043; --okText: #7ee787; --warn: #f2a83b; --danger: #ff6b6b;
      --radius: 12px;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
      font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden;
      -webkit-tap-highlight-color: transparent; }
    button { font-family: inherit; }

    #stage { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #screen { display: block; background: #000; cursor: none; touch-action: none; outline: none;
      image-rendering: auto; box-shadow: 0 0 0 1px #1b2733; }

    /* ---- Always-visible HUD (status + menu button), top-left ---- */
    #hud {
      position: fixed; top: 10px; left: 10px; z-index: 30;
      display: flex; align-items: center; gap: 8px;
      background: rgba(13,20,27,.72); backdrop-filter: blur(10px);
      border: 1px solid var(--line); border-radius: 999px;
      padding: 5px 6px 5px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.35);
      transition: opacity .25s; max-width: calc(100vw - 20px);
    }
    #hud.dim { opacity: .28; }
    #hud:hover { opacity: 1; }
    #dot { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); flex: none;
      box-shadow: 0 0 0 0 rgba(0,0,0,0); transition: background .2s; }
    #dot.ok { background: var(--ok); box-shadow: 0 0 10px 1px rgba(46,160,67,.7); }
    #dot.warn { background: var(--warn); }
    #dot.bad { background: var(--danger); }
    #hudText { color: var(--text); font-size: 12.5px; white-space: nowrap; overflow: hidden;
      text-overflow: ellipsis; font-variant-numeric: tabular-nums; }
    #hudText small { color: var(--muted); }
    #menuBtn {
      flex: none; display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent2); color: #fff; border: 0; cursor: pointer;
      border-radius: 999px; padding: 7px 13px; font-size: 13px; font-weight: 600;
    }
    #menuBtn:hover { background: #1d4ed8; }
    #menuBtn .cog { font-size: 15px; line-height: 1; }
    @media (max-width: 560px) { #menuBtn .lbl { display: none; } #menuBtn { padding: 8px 11px; } }

    /* ---- Slide-in settings panel ---- */
    #scrim { position: fixed; inset: 0; z-index: 40; background: rgba(0,0,0,.5);
      opacity: 0; pointer-events: none; transition: opacity .22s; }
    #scrim.show { opacity: 1; pointer-events: auto; }
    #panel {
      position: fixed; top: 0; right: 0; bottom: 0; z-index: 41;
      width: min(360px, 100vw); background: var(--panel);
      border-left: 1px solid var(--line); box-shadow: -20px 0 60px rgba(0,0,0,.5);
      transform: translateX(105%); transition: transform .26s cubic-bezier(.4,0,.2,1);
      display: flex; flex-direction: column; }
    #panel.show { transform: translateX(0); }
    .pHead { display: flex; align-items: center; justify-content: space-between;
      padding: 16px 18px; border-bottom: 1px solid var(--line); }
    .pHead h2 { margin: 0; font-size: 15px; font-weight: 700; }
    #closePanel { background: transparent; border: 0; color: var(--muted); cursor: pointer;
      font-size: 22px; line-height: 1; padding: 4px 8px; border-radius: 8px; }
    #closePanel:hover { color: var(--text); background: var(--panel2); }
    .pBody { overflow-y: auto; padding: 8px 16px 20px; flex: 1; }
    .sect { margin-top: 18px; }
    .sect > .sTitle { font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
      color: var(--muted); margin: 0 0 10px 2px; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px;
      padding: 9px 0; }
    .row + .row { border-top: 1px solid rgba(34,48,64,.55); }
    .row label { color: var(--text); font-size: 14px; }
    .row .val { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }

    select, input[type=text] {
      background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 9px 11px; font-size: 14px; outline: none; width: 100%;
    }
    select:focus, input[type=text]:focus { border-color: var(--accent); }
    input[type=range] { -webkit-appearance: none; appearance: none; width: 150px; height: 6px;
      background: var(--line); border-radius: 999px; outline: none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 18px; height: 18px;
      border-radius: 50%; background: var(--accent); cursor: pointer; border: 2px solid #0b1119; }
    input[type=range]::-moz-range-thumb { width: 18px; height: 18px; border-radius: 50%;
      background: var(--accent); cursor: pointer; border: 2px solid #0b1119; }

    /* toggle pill */
    .tog { position: relative; width: 46px; height: 26px; border-radius: 999px; border: 1px solid var(--line);
      background: var(--panel2); cursor: pointer; flex: none; transition: background .18s, border-color .18s; }
    .tog::after { content: ""; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px;
      border-radius: 50%; background: #6b7a89; transition: transform .18s, background .18s; }
    .tog.on { background: rgba(46,160,67,.22); border-color: var(--ok); }
    .tog.on::after { transform: translateX(20px); background: var(--okText); }
    .tog.disabled { opacity: .4; cursor: not-allowed; }

    .fullBtn { display: block; width: 100%; text-align: center; cursor: pointer;
      background: var(--panel2); color: var(--text); border: 1px solid var(--line);
      border-radius: 10px; padding: 12px; font-size: 14px; font-weight: 600; margin-top: 8px; }
    .fullBtn:hover { border-color: var(--accent); }
    .fullBtn.danger { color: #ffd7d7; border-color: rgba(255,107,107,.35); background: rgba(255,107,107,.08); }
    .fullBtn.danger:hover { border-color: var(--danger); }
    .sendRow { display: flex; gap: 8px; margin-top: 4px; }
    .sendRow .fullBtn { width: auto; margin: 0; padding: 10px 16px; flex: none; }

    /* ---- Connection overlay ---- */
    #overlay {
      position: fixed; inset: 0; z-index: 50; display: none; align-items: center; justify-content: center;
      background: rgba(5,8,11,.92); backdrop-filter: blur(3px); padding: 24px; }
    #overlay.show { display: flex; }
    .ovCard { width: min(380px, 100%); text-align: center; display: flex; flex-direction: column;
      align-items: center; gap: 14px; }
    .spinner { width: 40px; height: 40px; border: 3px solid #223040; border-top-color: var(--accent);
      border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    #ovIcon { font-size: 40px; line-height: 1; }
    #ovTitle { font-size: 18px; font-weight: 700; margin: 0; }
    #ovText { color: var(--muted); font-size: 14px; margin: 0; max-width: 320px; }
    .ovBtns { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 6px; }
    .ovBtn { cursor: pointer; border-radius: 10px; padding: 11px 18px; font-size: 14px; font-weight: 600;
      border: 1px solid var(--line); background: var(--panel2); color: var(--text); }
    .ovBtn:hover { border-color: var(--accent); }
    .ovBtn.primary { background: var(--accent2); border-color: var(--accent2); color: #fff; }
    .ovBtn.primary:hover { background: #1d4ed8; }

    #toast { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%) translateY(20px);
      z-index: 60; background: rgba(13,20,27,.95); border: 1px solid var(--line); border-radius: 999px;
      padding: 9px 16px; color: var(--text); font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity .3s, transform .3s; }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    /* ---- Privacy cover (shown whenever the window is not focused) ----------
       Fully opaque, tops everything, and says nothing that hints at what this
       page is. Anyone who glances at the screen just sees a generic reconnect. */
    #privacy { position: fixed; inset: 0; z-index: 80; display: none;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: #05080b; color: var(--muted); }
    #privacy.show { display: flex; }
    #privacy .pTxt { font-size: 15px; color: var(--muted); }
  </style>
</head>
<body>
  <div id="stage"><canvas id="screen" width="1920" height="1080" tabindex="0"></canvas></div>

  <!-- Always-visible status + menu button -->
  <div id="hud">
    <span id="dot"></span>
    <span id="hudText">Подключение…</span>
    <button id="menuBtn"><span class="cog">⚙</span><span class="lbl">Меню</span></button>
  </div>

  <!-- Settings drawer -->
  <div id="scrim"></div>
  <aside id="panel" aria-label="Настройки">
    <div class="pHead">
      <h2>Настройки</h2>
      <button id="closePanel" title="Закрыть">✕</button>
    </div>
    <div class="pBody">
      <div class="sect">
        <p class="sTitle">Экран</p>
        <div class="row">
          <label for="monitor">Монитор</label>
          <select id="monitor" style="width:190px"></select>
        </div>
        <div class="row">
          <label for="maxWidth">Чёткость</label>
          <select id="maxWidth" style="width:150px">
            <option value="960">960p</option>
            <option value="1280" selected>1280p</option>
            <option value="1600">1600p</option>
            <option value="1920">1920p</option>
            <option value="3840">Максимум</option>
          </select>
        </div>
      </div>

      <div class="sect">
        <p class="sTitle">Плавность</p>
        <div class="row">
          <label for="quality">Качество <span class="val" id="qualityVal">7</span></label>
          <input id="quality" type="range" min="1" max="10" value="7">
        </div>
        <div class="row">
          <label for="fps">Кадры/с <span class="val" id="fpsVal">30</span></label>
          <input id="fps" type="range" min="3" max="60" value="30">
        </div>
      </div>

      <div class="sect">
        <p class="sTitle">Режим</p>
        <div class="row">
          <label for="codecSel">⚡ Кодек<br><span class="val" style="font-size:12px">качество и скорость</span></label>
          <select id="codecSel" style="width:150px"></select>
        </div>
        <div class="row">
          <label>🖱 Локальный курсор<br><span class="val" style="font-size:12px">мгновенный, без задержки</span></label>
          <div class="tog on" id="curBtn" role="switch"></div>
        </div>
        <div class="row">
          <label>⌨ Захват клавиатуры<br><span class="val" style="font-size:12px">клавиши идут на компьютер</span></label>
          <div class="tog on" id="kbdBtn" role="switch"></div>
        </div>
        <button class="fullBtn" id="fsBtn">⛶ Полный экран <span class="val" style="font-size:12px">(F12)</span></button>
      </div>

      <div class="sect">
        <p class="sTitle">Ввод текста</p>
        <div class="sendRow">
          <input id="sendText" type="text" placeholder="набрать текст на компьютере…" autocomplete="off">
          <button class="fullBtn" id="sendBtn">Ввести</button>
        </div>
      </div>

      <div class="sect">
        <p class="sTitle">Действия</p>
        <button class="fullBtn" id="reconnectBtn">↻ Переподключиться</button>
        <button class="fullBtn danger" id="logoutBtn">⎋ Выйти</button>
      </div>
    </div>
  </aside>

  <!-- Connection overlay -->
  <div id="overlay" class="show">
    <div class="ovCard">
      <div class="spinner" id="ovSpinner"></div>
      <div id="ovIcon" hidden></div>
      <h1 id="ovTitle">Подключение…</h1>
      <p id="ovText">Устанавливаем связь с компьютером.</p>
      <div class="ovBtns">
        <button class="ovBtn primary" id="ovReconnect">↻ Переподключиться</button>
        <button class="ovBtn" id="ovReload">Обновить страницу</button>
        <button class="ovBtn" id="ovLogout">Выйти</button>
      </div>
    </div>
  </div>

  <div id="toast"></div>

  <!-- Privacy cover: replaces everything the moment the window loses focus -->
  <div id="privacy">
    <div class="spinner"></div>
    <div class="pTxt">Переподключение…</div>
  </div>

  <script>
  (function () {
    'use strict';

    // ---- Key mapping: browser event.code -> Windows virtual-key code --------
    const VK = {};
    for (let i = 0; i < 26; i++) VK['Key' + String.fromCharCode(65 + i)] = 0x41 + i;
    for (let i = 0; i < 10; i++) VK['Digit' + i] = 0x30 + i;
    for (let i = 0; i < 10; i++) VK['Numpad' + i] = 0x60 + i;
    for (let i = 1; i <= 12; i++) VK['F' + i] = 0x6F + i; // F1=0x70
    Object.assign(VK, {
      Enter: 0x0D, NumpadEnter: 0x0D, Escape: 0x1B, Backspace: 0x08, Tab: 0x09, Space: 0x20,
      ArrowLeft: 0x25, ArrowUp: 0x26, ArrowRight: 0x27, ArrowDown: 0x28,
      Home: 0x24, End: 0x23, PageUp: 0x21, PageDown: 0x22, Insert: 0x2D, Delete: 0x2E,
      ShiftLeft: 0xA0, ShiftRight: 0xA1, ControlLeft: 0xA2, ControlRight: 0xA3,
      AltLeft: 0xA4, AltRight: 0xA5, MetaLeft: 0x5B, MetaRight: 0x5C,
      CapsLock: 0x14, NumLock: 0x90, ScrollLock: 0x91, ContextMenu: 0x5D,
      PrintScreen: 0x2C, Pause: 0x13,
      Semicolon: 0xBA, Equal: 0xBB, Comma: 0xBC, Minus: 0xBD, Period: 0xBE,
      Slash: 0xBF, Backquote: 0xC0, BracketLeft: 0xDB, Backslash: 0xDC,
      BracketRight: 0xDD, Quote: 0xDE, IntlBackslash: 0xE2,
      NumpadMultiply: 0x6A, NumpadAdd: 0x6B, NumpadSubtract: 0x6D,
      NumpadDecimal: 0x6E, NumpadDivide: 0x6F,
    });
    const EXTENDED = new Set(['ArrowLeft','ArrowUp','ArrowRight','ArrowDown','Home','End',
      'PageUp','PageDown','Insert','Delete','NumpadDivide','NumpadEnter','ControlRight',
      'AltRight','PrintScreen','NumLock','ContextMenu']);
    const BTN = { 0: 0, 1: 2, 2: 1 };

    // ---- Elements -----------------------------------------------------------
    const $ = (id) => document.getElementById(id);
    const canvas = $('screen'), ctx = canvas.getContext('2d', { alpha: false });
    const stage = $('stage');
    const hud = $('hud'), dot = $('dot'), hudText = $('hudText');
    const panel = $('panel'), scrim = $('scrim'), menuBtn = $('menuBtn'), closePanel = $('closePanel');
    const overlay = $('overlay'), ovSpinner = $('ovSpinner'), ovIcon = $('ovIcon'),
          ovTitle = $('ovTitle'), ovText = $('ovText');
    const toast = $('toast');
    const privacyEl = $('privacy');

    // ---- State --------------------------------------------------------------
    let ws = null, wsOpened = false;
    let agentUp = null;          // null = unknown yet; true/false from relay
    let streaming = false;       // at least one frame drawn this session
    let manualClose = false;     // user logged out — stop reconnecting
    let backoff = 1000, reconnectTimer = null;
    let uiState = 'connecting';  // connecting | pc_offline | streaming | lost | auth
    let frameW = 1920, frameH = 1080;
    let pending = null, decoding = false;
    let controlEnabled = true;
    let instantCursor = true;
    let panelOpen = false;
    let lastFrameAt = 0;
    let privacy = false;         // window not focused -> hide everything remote
    let pendingClip = null;      // clipboard text waiting for focus to be written
    const pressed = new Set();

    const CAN_WC = (typeof window.VideoDecoder === 'function') && (typeof window.EncodedVideoChunk === 'function');
    let canH264 = CAN_WC, canHEVC = false;   // finalized by probeCodecs()
    const HEVC_CANDIDATES = ['hev1.1.6.L153.B0', 'hev1.1.6.L120.90', 'hev1.1.6.L123.B0', 'hvc1.1.6.L153.B0'];
    let HEVC_CODEC = HEVC_CANDIDATES[0];     // the first candidate the browser accepts
    let codecMode = 'mjpeg';                 // requested codec; finalized after probe
    let shownCodec = 'MJPEG';                // codec actually being decoded (for the HUD)
    let vdec = null, vdecCodec = null, gotKey = false, tsCounter = 0;

    const settings = { monitor: 0, quality: 7, fps: 30, maxWidth: 1280 };
    let lastRtt = null;
    function wsReady() { return ws && ws.readyState === 1; }
    function applyCursor() { canvas.style.cursor = instantCursor ? 'default' : 'none'; }

    // ---- UI: overlay + HUD rendering ---------------------------------------
    // renderHud() runs every second (ping/fps). renderOverlay() runs only on a
    // state change, so a longer hint (e.g. "unlock the PC") isn't clobbered.
    function renderHud() {
      let cls = 'warn', txt = 'Подключение…';
      if (uiState === 'streaming') {
        cls = 'ok';
        const ping = lastRtt === null ? '—' : lastRtt + 'мс';
        txt = 'Онлайн · ' + shownCodec + ' · ' + ping;
        hud.classList.add('dim');
      } else {
        hud.classList.remove('dim');
        if (uiState === 'pc_offline') { cls = 'bad'; txt = 'Не в сети'; }
        else if (uiState === 'lost') { cls = 'bad'; txt = 'Нет связи'; }
        else if (uiState === 'auth') { cls = 'bad'; txt = 'Сессия истекла'; }
      }
      dot.className = cls;
      hudText.textContent = txt;
    }
    function renderOverlay() {
      if (uiState === 'streaming') { overlay.classList.remove('show'); return; }
      overlay.classList.add('show');
      const spin = (uiState !== 'auth');
      ovSpinner.hidden = !spin; ovIcon.hidden = spin;
      if (uiState === 'connecting') {
        ovTitle.textContent = 'Подключение…';
        ovText.textContent = 'Устанавливаем соединение.';
      } else if (uiState === 'pc_offline') {
        ovIcon.textContent = '💤';
        ovTitle.textContent = 'Нет соединения';
        ovText.textContent = 'Соединение пока недоступно. Как только оно восстановится — продолжим автоматически.';
      } else if (uiState === 'lost') {
        ovTitle.textContent = 'Соединение потеряно';
        ovText.textContent = 'Переподключаемся автоматически…';
      } else if (uiState === 'auth') {
        ovIcon.textContent = '🔒';
        ovTitle.textContent = 'Сессия истекла';
        ovText.textContent = 'Нужно войти заново.';
      }
    }
    function setState(s) { uiState = s; renderOverlay(); renderHud(); }

    let stuckTimer = null;
    function armStuckHint() {
      clearTimeout(stuckTimer);
      stuckTimer = setTimeout(function () {
        if (uiState === 'connecting' && agentUp === true && !streaming) {
          ovText.textContent = 'Соединение есть, но нет изображения. Убедитесь, что устройство включено и разблокировано.';
        }
      }, 8000);
    }

    function showToast(msg) {
      toast.textContent = msg; toast.classList.add('show');
      clearTimeout(showToast._t); showToast._t = setTimeout(function () { toast.classList.remove('show'); }, 2200);
    }

    // ---- WebSocket ----------------------------------------------------------
    function connect() {
      clearTimeout(reconnectTimer); reconnectTimer = null;
      manualClose = false;
      const proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      try { ws = new WebSocket(proto + '//' + location.host + '/ws'); }
      catch (_) { scheduleReconnect(); return; }
      ws.binaryType = 'arraybuffer';
      wsOpened = false;
      if (!streaming) setState('connecting');

      ws.onopen = function () {
        wsOpened = true; backoff = 1000;
        resetH264(); pending = null;
        // Agent status is unknown until the relay tells us (or a frame arrives).
        // Against the local server directly there's no status msg, so a frame
        // will flip us to streaming on its own.
        if (agentUp === false) setState('pc_offline'); else setState('connecting');
        armStuckHint();
        pushSettings();  // harmless if the PC is offline (relay drops it)
      };

      ws.onmessage = function (e) {
        if (typeof e.data === 'string') {
          let m; try { m = JSON.parse(e.data); } catch (_) { return; }
          if (m.t === 'pong') { lastRtt = Math.round(performance.now() - m.ts); }
          else if (m.t === 'relay') { onAgentStatus(!!m.agent); }
          else if (m.t === 'clip') { writeClipboard(m.text); }
          return;
        }
        bytesWindow += e.data.byteLength || 0;
        const u8 = new Uint8Array(e.data);
        const tag = u8[0];
        const payload = u8.subarray(1);
        if (tag === 0x4A) { pending = payload; if (!decoding) pump(); }
        else if (tag === 0x4B || tag === 0x44) handleEncoded(payload, tag === 0x4B, 'avc');
        else if (tag === 0x45 || tag === 0x46) handleEncoded(payload, tag === 0x45, 'hevc');
      };

      ws.onclose = function () {
        if (manualClose) return;
        streaming = false;
        if (!wsOpened) {
          // Never reached "open": handshake failed (auth) or relay unreachable.
          probeThenReconnect();
        } else {
          setState('lost');
          scheduleReconnect();
        }
      };
      ws.onerror = function () { try { ws.close(); } catch (_) {} };
    }

    function scheduleReconnect() {
      clearTimeout(reconnectTimer);
      reconnectTimer = setTimeout(connect, backoff);
      backoff = Math.min(backoff * 2, 10000);
    }

    // Tell "session expired" (401) apart from "relay down"/"PC offline".
    function probeThenReconnect() {
      fetch('/status', { cache: 'no-store' }).then(function (r) {
        if (r.status === 401) { setState('auth'); return; }  // stop; user must log in
        return r.json().then(function (j) {
          agentUp = !!(j && j.agent);
          setState(agentUp ? 'connecting' : 'pc_offline');
          scheduleReconnect();
        });
      }).catch(function () { setState('lost'); scheduleReconnect(); });
    }

    function onAgentStatus(up) {
      const was = agentUp; agentUp = up;
      if (up) {
        if (!streaming) setState('connecting');
        armStuckHint();
        if (was === false) { resetH264(); pending = null; }
        pushSettings();          // PC just (re)appeared: (re)send our settings
      } else {
        streaming = false;
        setState('pc_offline');
      }
    }

    function markStreaming() {
      lastFrameAt = performance.now();
      if (!streaming) { streaming = true; agentUp = true; setState('streaming'); }
    }

    function forceReconnect() {
      showToast('Переподключение…');
      backoff = 1000; agentUp = null; streaming = false;
      try { if (ws) { ws.onclose = null; ws.close(); } } catch (_) {}
      setState('connecting');
      connect();
    }
    function doLogout() { manualClose = true; try { if (ws) ws.close(); } catch (_) {} location.href = '/logout'; }

    // ---- Clipboard: text copied on the PC lands in THIS device's clipboard --
    function writeClipboard(text) {
      if (typeof text !== 'string' || !text) return;
      if (!navigator.clipboard || !navigator.clipboard.writeText) { pendingClip = null; return; }
      // writeText only succeeds while the document is focused; otherwise stash
      // it and flush on the next focus.
      if (!document.hasFocus()) { pendingClip = text; return; }
      navigator.clipboard.writeText(text)
        .then(function () { pendingClip = null; showToast('Скопировано'); })
        .catch(function () { pendingClip = text; });
    }

    // ---- Privacy: the moment this window loses focus, cover the whole page
    // with a neutral "reconnecting" screen and drop the stream, so a person at
    // this device never sees what's on the other machine. Regaining focus
    // reconnects and reveals it again. Nothing on the cover hints at what this is.
    function toggleFullscreen() {
      try {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
      } catch (_) {}
    }
    function clearCanvas() { try { ctx.fillStyle = '#000'; ctx.fillRect(0, 0, canvas.width, canvas.height); } catch (_) {} }
    function enterPrivacy() {
      releaseAll();
      if (privacy) return;
      privacy = true;
      if (panelOpen) closeMenu();
      manualClose = true;
      streaming = false;
      clearTimeout(reconnectTimer); reconnectTimer = null;
      try { if (ws) { ws.onclose = null; ws.close(); } } catch (_) {}
      clearCanvas();
      hud.hidden = true;
      overlay.classList.remove('show');
      privacyEl.classList.add('show');
    }
    function exitPrivacy() {
      if (!privacy) return;
      privacy = false;
      privacyEl.classList.remove('show');
      hud.hidden = false;
      backoff = 1000; agentUp = null; streaming = false;
      setState('connecting');
      connect();            // connect() clears manualClose
      if (pendingClip) writeClipboard(pendingClip);
    }

    function send(obj) { if (wsReady()) ws.send(JSON.stringify(obj)); }
    function pushSettings() {
      resetH264(); pending = null;
      send({ t: 'settings', monitor: settings.monitor, fps: settings.fps,
        quality: settings.quality, maxWidth: settings.maxWidth,
        drawMouse: instantCursor ? 0 : 1, codec: codecMode });
    }

    // ---- H.264 decode (WebCodecs) -------------------------------------------
    function resetH264() {
      if (vdec) { try { vdec.close(); } catch (_) {} }
      vdec = null; vdecCodec = null; gotKey = false;
    }
    function spsCodec(u8) {
      let i = 0;
      while (i + 4 < u8.length) {
        if (u8[i] === 0 && u8[i + 1] === 0) {
          let sl = 0;
          if (u8[i + 2] === 1) sl = 3; else if (u8[i + 2] === 0 && u8[i + 3] === 1) sl = 4;
          if (sl) {
            if ((u8[i + sl] & 0x1f) === 7) {
              const hex = function (n) { return ('0' + n.toString(16)).slice(-2); };
              return 'avc1.' + hex(u8[i + sl + 1]) + hex(u8[i + sl + 2]) + hex(u8[i + sl + 3]);
            }
            i += sl; continue;
          }
        }
        i++;
      }
      return null;
    }
    function makeDecoder(codecString) {
      resetH264();
      vdec = new VideoDecoder({
        output: function (frame) {
          try {
            if (frame.displayWidth !== frameW || frame.displayHeight !== frameH) {
              frameW = frame.displayWidth; frameH = frame.displayHeight;
              canvas.width = frameW; canvas.height = frameH; fit();
            }
            ctx.drawImage(frame, 0, 0);
            framesWindow++; markStreaming();
          } finally { frame.close(); }
        },
        error: function (e) { console.warn('VideoDecoder error:', e && e.message); fallbackToMjpeg(); },
      });
      try {
        vdec.configure({ codec: codecString, optimizeForLatency: true, hardwareAcceleration: 'no-preference' });
        vdecCodec = codecString;
      } catch (e) { console.warn('configure failed:', e && e.message); fallbackToMjpeg(); }
    }
    // Decode whatever the server sends, chosen by the frame tag — so if the PC
    // silently falls back from H.265 to H.264, the picture keeps working.
    function handleEncoded(payload, isKey, fam) {
      try {
        if (isKey) {
          const cs = fam === 'hevc' ? HEVC_CODEC : spsCodec(payload);
          if (cs && cs !== vdecCodec) makeDecoder(cs);
        }
        if (!vdec) return;
        if (!gotKey) { if (!isKey) return; gotKey = true; }
        shownCodec = fam === 'hevc' ? 'H.265' : 'H.264';
        vdec.decode(new EncodedVideoChunk({
          type: isKey ? 'key' : 'delta',
          timestamp: (tsCounter += 1000),
          data: payload,
        }));
      } catch (e) { console.warn('decode failed:', e && e.message); fallbackToMjpeg(); }
    }
    function fallbackToMjpeg() {
      if (codecMode === 'mjpeg') return;
      console.warn('falling back to MJPEG');
      codecMode = 'mjpeg';
      resetH264();
      const cs = $('codecSel'); if (cs) cs.value = 'mjpeg';
      pushSettings();
    }

    // ---- Rendering (always draws the most recent frame, drops the rest) -----
    let framesWindow = 0, bytesWindow = 0;
    function pump() {
      if (!pending) return;
      decoding = true;
      const buf = pending; pending = null;
      createImageBitmap(new Blob([buf], { type: 'image/jpeg' })).then(function (bmp) {
        if (bmp.width !== frameW || bmp.height !== frameH) {
          frameW = bmp.width; frameH = bmp.height;
          canvas.width = frameW; canvas.height = frameH; fit();
        }
        ctx.drawImage(bmp, 0, 0);
        if (bmp.close) bmp.close();
        shownCodec = 'MJPEG';
        framesWindow++; markStreaming();
        decoding = false;
        if (pending) pump();
      }).catch(function () { decoding = false; if (pending) pump(); });
    }

    // ---- Fit canvas to the stage, preserving aspect ratio -------------------
    function fit() {
      const availW = stage.clientWidth, availH = stage.clientHeight;
      const ar = frameW / frameH;
      let w = availW, h = availW / ar;
      if (h > availH) { h = availH; w = availH * ar; }
      canvas.style.width = w + 'px';
      canvas.style.height = h + 'px';
    }
    window.addEventListener('resize', fit);

    // ---- Mouse / pointer ----------------------------------------------------
    function normFromEvent(e) {
      const r = canvas.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width;
      const ny = (e.clientY - r.top) / r.height;
      return [Math.max(0, Math.min(1, nx)), Math.max(0, Math.min(1, ny))];
    }
    let pendingMove = null, lastMoveSent = 0, moveTimer = null;
    function flushMove() {
      moveTimer = null;
      if (!pendingMove) return;
      send({ t: 'mm', x: pendingMove.x, y: pendingMove.y });
      pendingMove = null;
      lastMoveSent = performance.now();
    }
    canvas.addEventListener('pointermove', function (e) {
      if (panelOpen) return;
      const [x, y] = normFromEvent(e);
      pendingMove = { x, y };
      const dt = performance.now() - lastMoveSent;
      if (dt >= 8) flushMove();
      else if (!moveTimer) moveTimer = setTimeout(flushMove, 8 - dt);
    });
    canvas.addEventListener('pointerdown', function (e) {
      if (panelOpen) return;
      e.preventDefault();
      canvas.setPointerCapture(e.pointerId);
      const [x, y] = normFromEvent(e);
      send({ t: 'md', b: BTN[e.button] || 0, x, y });
    });
    canvas.addEventListener('pointerup', function (e) {
      if (panelOpen) return;
      const [x, y] = normFromEvent(e);
      send({ t: 'mu', b: BTN[e.button] || 0, x, y });
    });
    canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
    canvas.addEventListener('wheel', function (e) {
      if (panelOpen) return;
      e.preventDefault();
      const dy = e.deltaY ? -Math.sign(e.deltaY) * 120 : 0;
      const dx = e.deltaX ? Math.sign(e.deltaX) * 120 : 0;
      send({ t: 'wheel', dy, dx });
    }, { passive: false });

    // ---- Keyboard -----------------------------------------------------------
    function isField(el) { return el && (el.tagName === 'INPUT' || el.tagName === 'TEXTAREA' || el.isContentEditable); }
    window.addEventListener('keydown', function (e) {
      // F12 = fullscreen toggle for THIS page. Intercept it so it neither opens
      // the local browser devtools nor gets forwarded to the other machine.
      if (e.code === 'F12') { e.preventDefault(); e.stopPropagation(); toggleFullscreen(); return; }
      if (e.code === 'Escape' && panelOpen) { e.preventDefault(); closeMenu(); return; }
      if (panelOpen || !controlEnabled || isField(document.activeElement)) return;
      const vk = VK[e.code];
      if (vk === undefined) return;
      e.preventDefault();
      const ext = EXTENDED.has(e.code) ? 1 : 0;
      pressed.add(e.code);
      send({ t: 'kd', vk, e: ext });
    });
    window.addEventListener('keyup', function (e) {
      if (e.code === 'F12') { e.preventDefault(); return; }   // handled on keydown
      if (panelOpen || !controlEnabled || isField(document.activeElement)) return;
      const vk = VK[e.code];
      if (vk === undefined) return;
      e.preventDefault();
      const ext = EXTENDED.has(e.code) ? 1 : 0;
      pressed.delete(e.code);
      send({ t: 'ku', vk, e: ext });
    });
    function releaseAll() {
      pressed.forEach(function (code) { send({ t: 'ku', vk: VK[code], e: EXTENDED.has(code) ? 1 : 0 }); });
      pressed.clear();
    }
    window.addEventListener('blur', enterPrivacy);
    window.addEventListener('focus', exitPrivacy);
    document.addEventListener('visibilitychange', function () { if (document.hidden) enterPrivacy(); else exitPrivacy(); });

    // ---- Menu (drawer) ------------------------------------------------------
    function openMenu() { panelOpen = true; panel.classList.add('show'); scrim.classList.add('show'); releaseAll(); }
    function closeMenu() { panelOpen = false; panel.classList.remove('show'); scrim.classList.remove('show'); canvas.focus(); }
    function toggleMenu() { panelOpen ? closeMenu() : openMenu(); }
    menuBtn.addEventListener('click', toggleMenu);
    closePanel.addEventListener('click', closeMenu);
    scrim.addEventListener('click', closeMenu);

    // ---- Controls wiring ----------------------------------------------------
    const monitorSel = $('monitor'), qualityEl = $('quality'), fpsEl = $('fps'), maxWidthEl = $('maxWidth');
    const qualityVal = $('qualityVal'), fpsVal = $('fpsVal');
    const codecSel = $('codecSel'), curBtn = $('curBtn'), kbdBtn = $('kbdBtn'), fsBtn = $('fsBtn');
    const sendText = $('sendText'), sendBtn = $('sendBtn');

    // Probe which hardware-decodable codecs this browser/device supports, then
    // build the codec menu (best first) and pick a sensible default. H.265 gives
    // the best quality per bit; H.264 is the universal turbo; MJPEG always works.
    function buildCodecMenu() {
      const opts = [];
      if (canHEVC) opts.push(['h265', 'H.265 (макс.)']);
      if (canH264) opts.push(['h264', 'H.264 (турбо)']);
      opts.push(['mjpeg', 'MJPEG (совмест.)']);
      codecSel.innerHTML = '';
      opts.forEach(function (o) {
        const el = document.createElement('option'); el.value = o[0]; el.textContent = o[1];
        codecSel.appendChild(el);
      });
      codecMode = canHEVC ? 'h265' : (canH264 ? 'h264' : 'mjpeg');
      codecSel.value = codecMode;
    }
    async function probeCodecs() {
      if (CAN_WC) {
        try { const r = await VideoDecoder.isConfigSupported({ codec: 'avc1.42E01E' }); canH264 = !!(r && r.supported); } catch (_) { canH264 = false; }
        for (let i = 0; i < HEVC_CANDIDATES.length; i++) {
          try {
            const r = await VideoDecoder.isConfigSupported({ codec: HEVC_CANDIDATES[i] });
            if (r && r.supported) { HEVC_CODEC = HEVC_CANDIDATES[i]; canHEVC = true; break; }
          } catch (_) { /* try next */ }
        }
      } else { canH264 = false; canHEVC = false; }
      buildCodecMenu();
      pushSettings();   // re-send now that the real default codec is known
    }

    codecSel.addEventListener('change', function () {
      codecMode = codecSel.value;
      resetH264(); pending = null; pushSettings();
      showToast(codecMode === 'h265' ? 'H.265 — макс. качество' : codecMode === 'h264' ? 'H.264 — турбо' : 'MJPEG — совместимость');
    });
    curBtn.addEventListener('click', function () {
      instantCursor = !instantCursor;
      curBtn.classList.toggle('on', instantCursor);
      applyCursor(); pushSettings();
    });
    kbdBtn.addEventListener('click', function () {
      controlEnabled = !controlEnabled;
      kbdBtn.classList.toggle('on', controlEnabled);
      if (!controlEnabled) releaseAll();
      showToast(controlEnabled ? 'Клавиатура включена' : 'Клавиатура выключена');
    });
    fsBtn.addEventListener('click', toggleFullscreen);

    monitorSel.addEventListener('change', function () {
      settings.monitor = monitorSel.value === 'all' ? 'all' : parseInt(monitorSel.value, 10);
      pushSettings();
    });
    qualityEl.addEventListener('input', function () { qualityVal.textContent = qualityEl.value; });
    qualityEl.addEventListener('change', function () { settings.quality = +qualityEl.value; pushSettings(); });
    fpsEl.addEventListener('input', function () { fpsVal.textContent = fpsEl.value; });
    fpsEl.addEventListener('change', function () { settings.fps = +fpsEl.value; pushSettings(); });
    maxWidthEl.addEventListener('change', function () { settings.maxWidth = +maxWidthEl.value; pushSettings(); });

    function doSendText() {
      const t = sendText.value;
      if (t) { send({ t: 'type', text: t }); sendText.value = ''; showToast('Текст отправлен'); }
      closeMenu();
    }
    sendBtn.addEventListener('click', doSendText);
    sendText.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.stopPropagation(); doSendText(); } });

    $('reconnectBtn').addEventListener('click', function () { closeMenu(); forceReconnect(); });
    $('logoutBtn').addEventListener('click', doLogout);
    $('ovReconnect').addEventListener('click', forceReconnect);
    $('ovReload').addEventListener('click', function () { location.reload(); });
    $('ovLogout').addEventListener('click', doLogout);

    // ---- Monitors list ------------------------------------------------------
    fetch('/config.json').then(function (r) { return r.json(); }).then(function (cfg) {
      (cfg.monitors || []).forEach(function (m) {
        const o = document.createElement('option');
        o.value = m.index;
        o.textContent = 'Монитор ' + (m.index + 1) + ' (' + m.w + '×' + m.h + ')' + (m.primary ? ' ★' : '');
        monitorSel.appendChild(o);
      });
      if ((cfg.monitors || []).length > 1) {
        const o = document.createElement('option');
        o.value = 'all'; o.textContent = 'Все мониторы';
        monitorSel.appendChild(o);
      }
    }).catch(function () {});

    // ---- Stats + heartbeat --------------------------------------------------
    setInterval(function () {
      framesWindow = 0; bytesWindow = 0;
      if (wsReady() && streaming) ws.send(JSON.stringify({ t: 'ping', ts: performance.now() }));
      // If frames stop arriving while we think we're streaming, drop back.
      if (streaming && performance.now() - lastFrameAt > 4000) { streaming = false; setState(agentUp === false ? 'pc_offline' : 'connecting'); }
      renderHud();
    }, 1000);

    // ---- Go -----------------------------------------------------------------
    applyCursor(); fit(); renderOverlay(); renderHud(); probeCodecs(); connect();
  })();
  </script>
</body>
</html>
